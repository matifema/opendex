name: opendex
description: Capture an animal photo → generate a unique 1st-gen Pokémon–style pixel creature with transparent PNG sprite sheet, auto-generated name, stats, types, and flavor text.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  google_generative_ai: ^0.4.7
  http: ^1.5.0
  image: ^4.5.4
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/pokeball_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/pokeball_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
