name: pokegen_app
description: Capture animal photos and generate 1st-gen Pokémon–style pixel monsters with transparent PNG output and auto-generated stats.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  google_generative_ai: ^0.4.7
  http: ^1.5.0
  image: ^4.5.4
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
